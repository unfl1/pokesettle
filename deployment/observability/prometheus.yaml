global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: poketact
    static_configs:
      - targets: [api:9000]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]

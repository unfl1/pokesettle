[project]
name = "poketact-ai"
version = "0.1.0"
description = "근거 기반 포켓몬 지식 RAG 백엔드 (Phase 1)"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "langchain==1.3.14",
  "langgraph==1.2.10",
  "langsmith==0.10.17",
  "langchain-core==1.6.0",
  "langchain-openai==1.4.3",
  "langchain-community==0.4.2",
  "langchain-text-splitters==1.1.2",
  "psycopg[binary]>=3.2,<4",
  "numpy>=2,<3",
  "onnxruntime>=1.23,<2",
  "tokenizers>=0.22,<1",
  "openai==2.54.0",
  "requests==2.34.2",
  "python-dotenv==1.2.3",
  "typing-extensions==4.16.0",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
assignment-ui = ["streamlit==1.62.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

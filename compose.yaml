services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: poketact
      POSTGRES_USER: poketact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poketact -d poketact"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

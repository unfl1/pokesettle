name: Build release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A release already being built must finish.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/docker/Dockerfile
          tags: poketact-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=poketact-backend
          cache-to: type=gha,scope=poketact-backend,mode=max
      - name: Export built backend image
        run: docker save "poketact-backend:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/backend-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image-${{ github.sha }}
          path: ${{ runner.temp }}/backend-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Next.js production image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          tags: poketact-frontend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=poketact-frontend
          cache-to: type=gha,scope=poketact-frontend,mode=max
      - name: Export built frontend image
        run: docker save "poketact-frontend:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/frontend-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-image-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-image-${{ github.sha }}'
          path: images
          merge-multiple: true
      - name: Package the built images without rebuilding
        run: |
          docker load --input images/backend-image.tar.gz
          docker load --input images/frontend-image.tar.gz
          mkdir -p out
          docker save --output "$RUNNER_TEMP/image.tar" "poketact-backend:$GITHUB_SHA" "poketact-frontend:$GITHUB_SHA"
          python -m deployment.package_release --image "$RUNNER_TEMP/image.tar" --output out/backend-release.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: out/backend-release.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
